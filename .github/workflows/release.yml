name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-package:
    name: Package ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
          - runtime: osx-arm64
            os: macos-latest
          - runtime: osx-x64
            os: macos-latest
          - runtime: linux-x64
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MDBTestBench.sln

      - name: Test
        run: dotnet test MDBTestBench.sln --configuration Release --no-restore

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/package.ps1 -RuntimeIdentifier '${{ matrix.runtime }}' -Version $version

      - name: Package macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/package.sh '${{ matrix.runtime }}' "$version"

      - name: Upload packaged release asset
        uses: actions/upload-artifact@v4.6.2
        with:
          name: package-${{ matrix.runtime }}
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/*
          --repo "${{ github.repository }}"
          --title "MDB Test Bench ${{ github.ref_name }}"
          --generate-notes
