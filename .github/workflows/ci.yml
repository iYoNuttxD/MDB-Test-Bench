name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MDBTestBench.sln

      - name: Build
        run: dotnet build MDBTestBench.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MDBTestBench.sln --configuration Release --no-build
